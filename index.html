<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>周湍淇住宅楼 · 九层平面（26.900）互动模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe4; --paper2:#ede7d8; --ink:#26221a; --ink2:#5c5648;
    --accent:#b5442d; --blue:#46608c; --line:rgba(38,34,26,.16);
    --panel:rgba(250,247,240,.94);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong",serif;color:var(--ink);
    background:var(--paper);
  }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block}
  #planCanvas{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}

  /* ---- 楼层切换器（右侧竖排）---- */
  #floorStrip{
    position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:20;
    display:flex;flex-direction:column;gap:4px;background:var(--panel);
    border:1px solid var(--line);border-radius:4px;padding:6px;
    box-shadow:0 10px 30px rgba(30,25,15,.14);;
  }
  .floor-btn{
    border:1px solid transparent;background:transparent;cursor:pointer;border-radius:3px;
    font-family:inherit;color:var(--ink2);padding:4px 8px;min-width:52px;text-align:center;
    transition:all .15s;
  }
  .floor-btn span{display:block;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
  .floor-btn i{display:block;font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--ink2)}
  .floor-btn:hover{background:rgba(181,68,45,.08)}
  .floor-btn.on{background:var(--ink);color:#f4efe4}
  .floor-btn.on i{color:#d9c9a8}

  /* ---- VR 漫游 HUD ---- */
  #vrChip{
    position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:20;display:none;
    background:rgba(38,34,26,.88);color:#f4efe4;font-size:12.5px;letter-spacing:.08em;
    padding:6px 16px;border-radius:999px;pointer-events:none;font-family:"Noto Serif SC",serif;
    
  }

  /* ---- 建模加载遮罩 ---- */
  #loading{
    position:fixed;inset:0;z-index:100;background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .45s;
  }
  #loading.done{opacity:0;pointer-events:none}
  #loading .seal{width:64px;height:64px;font-size:26px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* ---- 悬停提示 ---- */
  #hoverChip{
    position:fixed;display:none;z-index:30;pointer-events:none;
    background:var(--ink);color:#f4efe4;font-size:13px;letter-spacing:.08em;
    padding:5px 12px;border-radius:2px;font-family:"Noto Serif SC",serif;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }

  /* ---- 品牌图签（左上）---- */
  #brand{
    position:fixed;top:18px;left:20px;z-index:20;pointer-events:none;
    display:flex;gap:14px;align-items:stretch;
  }
  #brand .seal{
    width:54px;height:54px;background:var(--accent);color:#f7f2e6;border-radius:3px;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;
    letter-spacing:2px;box-shadow:0 6px 16px rgba(181,68,45,.35);writing-mode:vertical-rl;
  }
  #brand .meta h1{font-size:19px;font-weight:900;letter-spacing:.06em}
  #brand .meta p{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);margin-top:4px;letter-spacing:.05em}
  #brand .meta em{font-style:normal;color:var(--accent)}

  /* ---- 工具条（顶部居中）---- */
  #toolbar{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;gap:8px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:4px;padding:7px 10px;
    box-shadow:0 10px 30px rgba(30,25,15,.14);;
  }
  .seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{
    border:none;background:transparent;color:var(--ink2);cursor:pointer;
    font-family:inherit;font-size:13px;padding:6px 13px;letter-spacing:.06em;
    border-right:1px solid var(--line);transition:all .18s;
  }
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#f4efe4}
  .seg button:not(.on):hover{background:rgba(38,34,26,.07)}
  .tbtn{
    border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;
    font-family:inherit;font-size:13px;padding:6px 13px;border-radius:3px;letter-spacing:.06em;
    transition:all .18s;
  }
  .tbtn:hover{background:rgba(38,34,26,.07)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .vline{width:1px;height:22px;background:var(--line)}

  /* ---- 侧栏（左下房间索引）---- */
  #sidebar{
    position:fixed;left:20px;top:96px;bottom:20px;width:212px;z-index:15;
    display:flex;flex-direction:column;gap:10px;pointer-events:none;
  }
  .panel{
    pointer-events:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:4px;box-shadow:0 10px 30px rgba(30,25,15,.12);;
  }
  #bInfo{padding:13px 15px}
  #bInfo h3{font-size:13px;letter-spacing:.2em;color:var(--accent);margin-bottom:8px}
  #bInfo p{font-size:12.5px;line-height:1.75;color:var(--ink2)}
  #roomList{padding:8px;overflow-y:auto;flex:1;min-height:0}
  #roomList::-webkit-scrollbar{width:4px}
  #roomList::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
  .room-item{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 10px;border-radius:3px;cursor:pointer;transition:all .15s;
    border-bottom:1px dashed var(--line);
  }
  .room-item:last-child{border-bottom:none}
  .room-item:hover{background:rgba(181,68,45,.08)}
  .room-item:hover .room-name{color:var(--accent)}
  .room-name{font-size:14px;letter-spacing:.1em}
  .room-area{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2)}

  /* ---- 信息面板（右侧）---- */
  #infoPanel{
    position:fixed;right:20px;top:96px;width:330px;max-height:calc(100% - 130px);z-index:20;
    padding:20px 22px;overflow-y:auto;
    transform:translateX(24px);opacity:0;pointer-events:none;
    transition:all .35s cubic-bezier(.2,.8,.2,1);
  }
  #infoPanel.open{transform:none;opacity:1;pointer-events:auto}
  #infoPanel::-webkit-scrollbar{width:4px}
  #infoPanel::-webkit-scrollbar-thumb{background:var(--line)}
  .info-tag{
    display:inline-block;font-size:11px;letter-spacing:.3em;color:var(--accent);
    border:1px solid rgba(181,68,45,.45);padding:3px 9px 3px 12px;border-radius:2px;margin-bottom:10px;
  }
  #infoPanel h2{font-size:26px;font-weight:900;letter-spacing:.12em;margin-bottom:14px}
  .info-grid{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .info-grid div{
    display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);
  }
  .info-grid i{font-style:normal;font-size:11.5px;color:var(--ink2);white-space:nowrap;letter-spacing:.1em}
  .info-grid b{font-family:"IBM Plex Mono","Noto Serif SC",monospace;font-size:12px;font-weight:500;line-height:1.6}
  .info-desc{font-size:13.5px;line-height:2;color:var(--ink);text-align:justify}
  .info-actions{display:flex;gap:8px;margin-top:16px}
  .btn{
    flex:1;border:1px solid var(--ink);background:transparent;color:var(--ink);
    font-family:inherit;font-size:13px;letter-spacing:.12em;padding:9px 0;border-radius:3px;
    cursor:pointer;transition:all .18s;
  }
  .btn:hover{background:rgba(38,34,26,.08)}
  .btn.primary{background:var(--ink);color:#f4efe4}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent)}

  /* ---- 底部提示 ---- */
  #hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:15;
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);
    letter-spacing:.08em;background:var(--panel);border:1px solid var(--line);
    border-radius:3px;padding:6px 16px;pointer-events:none;
  }
  #hint b{color:var(--accent);font-weight:600}

  /* ---- 夜间模式下 UI 微调 ---- */
  body.is-night #brand .meta h1{color:#e8e2d2}
  body.is-night #hint,body.is-night #bInfo p{color:#b7b0a0}

  .mobile-only{display:none}

  /* ---- 移动端：底部导航 + 底部弹层 ---- */
  /* ---------- 批注模式 ---------- */
  #btnReview.on{background:var(--ink);color:#f6f2e9;border-color:var(--ink)}
  #notePanel{position:fixed;right:16px;bottom:16px;width:330px;max-height:58vh;display:none;flex-direction:column;z-index:24;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 34px rgba(30,25,15,.18);overflow:hidden}
  #notePanel.open{display:flex}
  #notePanel header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.06em;color:var(--ink2)}
  #notePanel header b{color:var(--ink);font-size:13px;letter-spacing:.1em}
  #noteClose{margin-left:auto;border:none;background:transparent;font-size:17px;line-height:1;cursor:pointer;color:var(--ink2)}
  #noteList{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
  .note-empty{color:var(--ink2);opacity:.65;font-size:12px;padding:10px 6px;line-height:1.7}
  .note-card{border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px;background:rgba(255,255,255,.55)}
  .note-card .nc-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .note-card .nc-floor{color:var(--ink2);opacity:.85}
  .note-card .nc-cat{background:var(--ink);color:#f6f2e9;border-radius:3px;padding:1px 6px;font-size:11px}
  .note-card .nc-obj{font-weight:600;color:var(--ink)}
  .note-card .nc-txt{margin:5px 0;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .note-card .nc-meta{color:var(--ink2);opacity:.7;font-size:11px}
  .note-card .nc-acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .note-card button{font-family:inherit;font-size:11px;padding:2px 9px;border:1px solid var(--line);background:transparent;border-radius:3px;cursor:pointer;color:var(--ink2)}
  .note-card button.on{background:var(--ink);color:#f6f2e9;border-color:var(--ink)}
  .note-card.done .nc-txt{text-decoration:line-through;opacity:.5}
  #noteActions{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  #noteActions button{flex:1;font-family:inherit;font-size:11px;padding:6px 2px;border:1px solid var(--line);background:transparent;border-radius:3px;cursor:pointer;color:var(--ink2)}
  #marquee{position:fixed;border:1.5px dashed #b5442d;background:rgba(181,68,45,.08);pointer-events:none;display:none;z-index:26;border-radius:2px}
  #marquee.on{display:block}
  #noteComposer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,400px);display:none;flex-direction:column;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 50px rgba(30,25,15,.3);padding:14px}
  #noteComposer.open{display:flex}
  #ncTitle{font-size:13px;color:var(--ink);margin-bottom:9px;line-height:1.55}
  #ncTitle b{color:var(--ink)}
  #ncCats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  #ncCats button{font-family:inherit;font-size:11px;padding:3px 10px;border:1px solid var(--line);background:transparent;border-radius:3px;cursor:pointer;color:var(--ink2)}
  #ncCats button.on{background:var(--ink);color:#f6f2e9;border-color:var(--ink)}
  #ncAuthor{width:100%;font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fffdf8;color:var(--ink);box-sizing:border-box;margin-bottom:8px}
  #ncText{width:100%;min-height:78px;resize:vertical;font-family:inherit;font-size:13px;line-height:1.6;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fffdf8;color:var(--ink);box-sizing:border-box}
  #ncActions{display:flex;gap:8px;margin-top:10px}
  #ncActions button{flex:1;font-family:inherit;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink2)}
  #ncSave{background:var(--ink);color:#f6f2e9;border-color:var(--ink)}
  @media (max-width:860px){
    #notePanel{left:8px;right:8px;bottom:8px;width:auto;max-height:42vh}
    #noteComposer{width:92vw;padding:12px}
  }
  @media (max-width:860px){
    #brand{top:10px;left:10px}
    #brand .seal{width:42px;height:42px;font-size:17px}
    #brand .meta h1{font-size:15px}
    #brand .meta p{font-size:10px}
    #hint{display:none}
    #hoverChip{display:none !important}

    /* 底部工具条：单行横向滚动，拇指可达 */
    #toolbar{
      top:auto;bottom:calc(8px + env(safe-area-inset-bottom));
      left:8px;right:8px;transform:none;max-width:none;
      flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
      padding:6px;gap:6px;
    }
    #toolbar::-webkit-scrollbar{display:none}
    .mobile-only{display:inline-block;flex:0 0 auto}
    .seg button,.tbtn{font-size:12px;padding:7px 11px;white-space:nowrap;flex:0 0 auto}
    .vline{flex:0 0 auto}

    /* 楼层切换：工具条上方横向胶囊条 */
    #floorStrip{
      flex-direction:row;overflow-x:auto;scrollbar-width:none;
      top:auto;bottom:calc(64px + env(safe-area-inset-bottom));
      left:8px;right:8px;transform:none;max-width:none;
      padding:4px;gap:3px;
    }
    #floorStrip::-webkit-scrollbar{display:none}
    .floor-btn{min-width:48px;flex:0 0 auto;padding:3px 6px}
    .floor-btn i{font-size:8px}

    /* 房间索引：底部弹层（工具条“房间”按钮开关） */
    #sidebar{
      display:flex;left:8px;right:8px;width:auto;top:auto;
      bottom:calc(120px + env(safe-area-inset-bottom));
      max-height:44dvh;
      transform:translateY(130%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    }
    #sidebar.open{transform:none}

    /* 讲解卡：底部弹层 */
    #infoPanel{
      left:8px;right:8px;width:auto;top:auto;
      bottom:calc(8px + env(safe-area-inset-bottom));
      max-height:62dvh;padding:16px 18px;
    }
    #infoPanel.open{transform:none}
    #loading .seal{width:54px;height:54px;font-size:22px}
  }
</style>
</head>
<body>
<div id="loading">
  <div class="seal">宅</div>
  <div>正在等比建模 · 负一层至屋面层</div>
</div>
<div id="stage"></div>
<canvas id="planCanvas"></canvas>
<div id="vrChip"></div>
<div id="hoverChip"></div>

<div id="brand">
  <div class="seal">宅</div>
  <div class="meta">
    <h1>周湍淇住宅楼 · 全楼层</h1>
    <p>负一层 — 屋面层 · 建施 2025-11 · <em>总高 31.25m</em></p>
  </div>
</div>

<div id="toolbar">
  <div class="seg" id="modeSeg">
    <button data-m="real" class="on">真实材质</button>
    <button data-m="white">白模</button>
    <button data-m="wire">线框</button>
  </div>
  <div class="vline"></div>
  <button class="tbtn" id="btnNight">☀️ 白天</button>
  <button class="tbtn on" id="btnFurn">家具 · 显</button>
  <div class="vline"></div>
  <button class="tbtn mobile-only" id="btnRooms">房间</button>
  <button class="tbtn" id="btnVR">VR 漫游</button>
  <button class="tbtn" id="btnPlan">平面图</button>
  <button class="tbtn" id="btnReview">批注</button>
  <button class="tbtn" id="btnReset">总览</button>
</div>

<div id="sidebar">
  <div class="panel" id="bInfo">
    <h3>建 筑 概 况</h3>
    <p id="introText"></p>
  </div>
  <div class="panel" id="roomList"></div>
</div>

<div class="panel" id="infoPanel"></div>

<div id="floorStrip"></div>

<div id="notePanel">
  <header><b>批注意见</b><span id="noteCount"></span><button id="noteClose">×</button></header>
  <div id="noteList"></div>
  <div id="noteActions">
    <button id="noteExport">导出 JSON</button>
    <button id="noteMd">复制 Markdown</button>
    <button id="noteClear">清空</button>
  </div>
</div>
<div id="marquee"></div>
<div id="noteComposer">
  <div id="ncTitle"></div>
  <div id="ncCats"></div>
  <input id="ncAuthor" maxlength="12" placeholder="你的名字/昵称（用于署名）" />
  <textarea id="ncText" placeholder="描述问题：位置不对 / 朝向反了 / 尺寸偏差 / 材质不符 / 建议增删…"></textarea>
  <div id="ncActions"><button id="ncCancel">取消</button><button id="ncSave">保存批注</button></div>
</div>
<div id="hint">左键拖拽旋转 · 滚轮缩放 · <b>点击房间/家具</b>查看讲解 · <b>VR 漫游</b>：拖拽环视/点地行走 · <b>右侧切换楼层</b> · 快捷键 <b>1/2/3</b> 材质 <b>N</b> 昼夜 <b>F</b> 家具 <b>P</b> 平面图 <b>R</b> 复位</div>

<script src="./data.js?v=32"></script>
<script type="importmap">{ "imports": { "three": "./libs/three.module.js" } }</script>
<script type="module" src="./app.js?v=32"></script>
<script>
  window.__errs = [];
  window.addEventListener('error', e => window.__errs.push(e.message + ' @' + (e.filename||'') + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => window.__errs.push('rejection: ' + String(e.reason)));
  document.getElementById('introText').textContent = META.intro;
</script>
</body>
</html>
