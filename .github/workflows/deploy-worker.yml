name: 部署批注代理 Worker

# 触发：worker/ 目录有改动时自动部署；也可在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 可选：配了 GH_ISSUES_TOKEN 才会同步 GitHub Issues；未配置时下列步骤自动跳过
      GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 部署到 Cloudflare Workers（并注入飞书密钥）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            FEISHU_APP_ID
            FEISHU_APP_SECRET
            BITABLE_APP_TOKEN
            TABLE_ID
            ALLOW_ORIGIN
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          TABLE_ID: ${{ secrets.TABLE_ID }}
          ALLOW_ORIGIN: https://rossbool.github.io

      - name: 注入 GitHub Issues 令牌（可选）
        if: env.GH_ISSUES_TOKEN != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "$GH_ISSUES_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          echo "RossBool/house3d" | npx wrangler secret put GITHUB_REPO
          echo "✅ GitHub Issues 同步已启用"

      - name: 部署结果提示
        run: |
          echo "✅ Worker 已部署"
          echo "自检地址： https://house3d-note-proxy.<你的账户子域>.workers.dev/health"
